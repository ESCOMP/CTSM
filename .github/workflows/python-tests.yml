name: Run Python tests

on:
  push:
    # Run when a change to these files is pushed to any branch. Without the "branches:" line, for some reason this will be run whenever a tag is pushed, even if the listed files aren't changed.
    branches: ['*']
    paths:
      - 'python/**'
      - 'cime_config/SystemTests/**'
      - 'cime_config/buildlib/**'
      - 'cime_config/buildnml/**'
  pull_request:
    # Run on pull requests that change the listed files
    paths:
      - 'python/**'
      - 'cime_config/SystemTests/**'
      - 'cime_config/buildlib/**'
      - 'cime_config/buildnml/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          lfs: true

      # Check out cime because some unit tests import it
      - name: Checkout cime submodule
        run: |
          bin/git-fleximod update cime

      # Check out doc-builder to get requirements.txt
      - name: Checkout doc-builder submodule
        run: |
          bin/git-fleximod update doc-builder

      # Set up the conda environment
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          activate-environment: ctsm_pylib
          environment-file: python/conda_env_ctsm_py.yml
          channels: conda-forge
          auto-activate: false

      - name: Print installed Python packages
        run: conda list

      # Run Python unit tests check
      - name: Run Python unit tests
        run: |
          cd python
          conda run -n ctsm_pylib ./run_ctsm_py_tests -u

  python-lint-and-black:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Check out doc-builder to get requirements.txt
      - name: Checkout doc-builder submodule
        run: |
          bin/git-fleximod update doc-builder

      # Set up the conda environment
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        with:
          activate-environment: ctsm_pylib
          environment-file: python/conda_env_ctsm_py.yml
          channels: conda-forge
          auto-activate: false

      - name: Print installed Python packages
        run: conda list

      # Run pylint check
      - name: Run pylint
        run: |
          cd python
          conda run -n ctsm_pylib make lint

      # Run black check
      - name: Run black
        # Run this step even if previous step(s) failed
        if: success() || failure()
        run: |
          cd python
          conda run -n ctsm_pylib make black
