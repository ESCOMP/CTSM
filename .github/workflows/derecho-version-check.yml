name: Check ctsm-ci-derecho-gnu Dockerfile matches derecho's gnu stack

on:
  push:
    # The "branches" line is required, or this also runs on tag pushes even when
    # none of the watched files changed (same as check-clm6-aliases.yml).
    branches: ['*']
    paths:
      - 'docker/ctsm-ci-derecho-gnu/Dockerfile'
      - 'docker/ctsm-ci-derecho-gnu/derecho-versions.ini'
      - 'docker/ctsm-ci-derecho-gnu/check-derecho-versions.py'
      - '.github/workflows/derecho-version-check.yml'
      # ccs_config is a submodule; a config_machines.xml change arrives as a
      # bump of the ccs_config gitlink. Its gitlink and the .gitmodules fxtag
      # are kept consistent by a separate check, so watching the gitlink path
      # is enough -- also watching .gitmodules would over-trigger on unrelated
      # submodule bumps.
      - 'ccs_config'
  pull_request:
    paths:
      - 'docker/ctsm-ci-derecho-gnu/Dockerfile'
      - 'docker/ctsm-ci-derecho-gnu/derecho-versions.ini'
      - 'docker/ctsm-ci-derecho-gnu/check-derecho-versions.py'
      - '.github/workflows/derecho-version-check.yml'
      - 'ccs_config'
  workflow_dispatch:

jobs:
  check-derecho-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.x'

      # ccs_config (which holds machines/derecho/config_machines.xml) is a
      # fleximod external; pull just that one component.
      - name: Check out ccs_config
        run: bin/git-fleximod update ccs_config

      - name: Check Dockerfile versions against derecho's gnu stack
        run: python docker/ctsm-ci-derecho-gnu/check-derecho-versions.py
