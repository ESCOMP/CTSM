# derecho-versions.ini -- HAND-MAINTAINED record of derecho gnu-stack versions
# that check-derecho-versions.py cannot read live from
# ccs_config/machines/derecho/config_machines.xml.
#
# HOW TO UPDATE (do this on derecho or casper, then edit the value below AND the
# matching Dockerfile ARG in the same commit):
#   module --force purge
#   module load ncarenv/23.09 gcc/12.2.0 cray-mpich/8.1.27 netcdf-mpi/4.9.2
#   module show netcdf-mpi     # -> the bundled HDF5 version
#   nf-config --version        # -> the netCDF-Fortran version
#
# A later scheduled probe (Phase 2) will read these live and fail/notify when
# derecho drifts from the values below -- so you are told when to update.

[snapshot]
# Bundled inside derecho's netcdf-mpi Spack module; no standalone module exists
# in config_machines.xml. Compared directly to the Dockerfile HDF5_VERSION and
# NETCDF_FORTRAN_VERSION ARGs.
hdf5 = 1.12.2
netcdf_fortran = 4.6.1

[deviation_guard]
# cray-mpich is proprietary; the container uses open-source MPICH 3.4.3 as a
# stand-in (Dockerfile MPICH_VERSION), which is NOT compared to this value. The
# check reads the live cray-mpich/<version> (gnu) from the config and asserts it
# still equals this; if derecho bumps cray-mpich, the check fails so the MPICH
# stand-in can be re-evaluated.
cray_mpich = 8.1.27
