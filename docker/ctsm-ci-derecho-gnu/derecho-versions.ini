# derecho-versions.ini -- HAND-MAINTAINED record of derecho gnu-stack versions
# that check-derecho-versions.py cannot read live from
# ccs_config/machines/derecho/config_machines.xml.
#
# HOW TO UPDATE (do this on derecho or casper, then edit the value below AND the
# matching Dockerfile ARG in the same commit). Load the versions
# config_machines.xml loads *today*, not the ones recorded below, or you just
# re-measure the same stale bundle:
#   module --force purge
#   module load ncarenv/25.10 gcc/14.3.0 cray-mpich/8.1.32 netcdf-mpi/4.9.3
#   module show netcdf-mpi | grep -i hdf5   # -> the hdf5-mpi dependency version
#   nf-config --version                     # -> the netCDF-Fortran version
#
# [snapshot] was measured 2026-10-06 against netcdf-mpi/4.9.3 under
# ncarenv/25.10, which is what config_machines.xml loads at
# ccs_config_cesm1.0.88. Re-measure whenever that module moves: these values
# mean nothing except relative to it, and the check does not yet enforce the
# pairing -- see "Remaining steps" item 7 in NEXT_STEPS.md for the guard that
# would.
#
# A later scheduled probe (Phase 2) will read these live and fail/notify when
# derecho drifts from the values below -- so you are told when to update.

[snapshot]
# Neither is named in config_machines.xml: netCDF-Fortran is bundled inside
# derecho's netcdf-mpi Spack module, and HDF5 arrives as the separate hdf5-mpi
# module that netcdf-mpi pulls in through depends_on. Compared directly to the
# Dockerfile HDF5_VERSION and NETCDF_FORTRAN_VERSION ARGs.
hdf5 = 1.14.6
netcdf_fortran = 4.6.2

[deviation_guard]
# cray-mpich is proprietary; the container uses open-source MPICH 3.4.3 as a
# stand-in (Dockerfile MPICH_VERSION), which is NOT compared to this value. The
# check reads the live cray-mpich/<version> (gnu) from the config and asserts it
# still equals this; if derecho bumps cray-mpich, the check fails so the MPICH
# stand-in can be re-evaluated.
cray_mpich = 8.1.27
