# derecho-versions.ini -- HAND-MAINTAINED record of derecho gnu+mpi-serial
# versions that check-derecho-versions.py cannot read live from
# ccs_config/machines/derecho/config_machines.xml.
#
# HOW TO UPDATE (do this on derecho or casper, then edit the value below AND the
# matching Dockerfile ARG in the same commit). Load the versions
# config_machines.xml loads *today*, not the ones recorded below, or you just
# re-measure the same stale bundle:
#   module --force purge
#   module load ncarenv/25.10 gcc/14.3.0 netcdf/4.9.3
#   module show netcdf | grep -i hdf5   # -> the hdf5 dependency version
#   nf-config --version                 # -> the netCDF-Fortran version
#
# [snapshot] was measured 2026-10-09 against netcdf/4.9.3 under ncarenv/25.10 --
# the serial netCDF module, which is what config_machines.xml loads for
# mpilib="mpi-serial" at ccs_config_cesm1.0.88, and what the container
# replicates. (The numbers are the same ones the earlier netcdf-mpi measurement
# gave; only the provenance moved.) These values mean nothing except relative to
# that module, so the pairing is recorded below and enforced: if the netcdf
# VERSION moves and the snapshot is not re-measured, the check fails instead of
# comparing stale against stale and passing.
#
# That is all the guard covers. derecho can repoint an unchanged netcdf/<ver>
# at a different hdf5 -- ncarenv/24.12 and ncarenv/25.10 both carry
# netcdf/4.9.3, depending on hdf5/1.12.3 and hdf5/1.14.6 respectively -- and
# neither the pairing below nor anything else in check-derecho-versions.py
# would notice. Re-measure whenever ccs_config moves ncarenv, not only when it
# moves netcdf. Closing that properly needs a live read of the module tree's
# depends_on and belongs to the scheduled drift check (NEXT_STEPS item 5).

[snapshot]
# Neither is named in config_machines.xml: netCDF-Fortran is bundled inside
# derecho's netcdf Spack module, and HDF5 arrives as the separate hdf5 module
# that netcdf pulls in through depends_on. Compared directly to the Dockerfile
# HDF5_VERSION and NETCDF_FORTRAN_VERSION ARGs. Measured 2026-10-09 from
# /glade/u/apps/derecho/modules/25.10/gcc/14.3.0/netcdf/4.9.3.lua
# (depends_on("hdf5/1.14.6")) and from that module's own nf-config.
hdf5 = 1.14.6
netcdf_fortran = 4.6.2

# Which netcdf VERSION the two values above were read from. The check compares
# this against the live netcdf in config_machines.xml and fails when they
# differ, so a snapshot taken from a netcdf derecho has since replaced goes red
# instead of quietly comparing equal to an equally stale ARG. It cannot see a
# same-version netcdf repointed at a different hdf5; see the header. Update it
# in the same edit as the values whenever you re-measure.
measured_against_netcdf = 4.9.3

[deviation_guard]
# cray-libsci is proprietary; the container uses reference LAPACK/BLAS as a
# stand-in (dnf lapack-devel/blas-devel, which carry no Dockerfile version ARG
# and so are NOT compared to this value). The check reads the live
# cray-libsci/<version> (gnu) from the config and asserts it still equals this;
# if derecho bumps cray-libsci, the check fails so the stand-in can be
# re-evaluated.
cray_libsci = 25.03.0
