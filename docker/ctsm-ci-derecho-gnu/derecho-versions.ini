# derecho-versions.ini -- HAND-MAINTAINED record of derecho gnu-stack versions
# that check-derecho-versions.py cannot read live from
# ccs_config/machines/derecho/config_machines.xml.
#
# HOW TO UPDATE (do this on derecho or casper, then edit the value below AND the
# matching Dockerfile ARG in the same commit):
#   module --force purge
#   module load ncarenv/23.09 gcc/12.2.0 cray-mpich/8.1.27 netcdf-mpi/4.9.2
#   module show netcdf-mpi     # -> the bundled HDF5 version
#   nf-config --version        # -> the netCDF-Fortran version
#
# A later scheduled probe (Phase 2) will read these live and fail/notify when
# derecho drifts from the values below -- so you are told when to update.
#
# POLICY, set 2026-10-01: the image is PINNED to a known-good derecho, recorded
# in [pinned_baseline] below. The Dockerfile ARGs are checked against that pin,
# not against live derecho. Derecho moving ahead of the pin is reported as
# "how far behind the image is", not treated as a failure -- chasing derecho is
# a deliberate, separate decision, because it means a rebuild and revalidation.

[snapshot]
# Bundled inside derecho's netcdf-mpi Spack module; no standalone module exists
# in config_machines.xml. Compared directly to the Dockerfile HDF5_VERSION and
# NETCDF_FORTRAN_VERSION ARGs.
hdf5 = 1.12.2
netcdf_fortran = 4.6.1

[deviation_guard]
# cray-mpich is proprietary; the container uses open-source MPICH 3.4.3 as a
# stand-in (Dockerfile MPICH_VERSION), which is NOT compared to this value. The
# check reads the live cray-mpich/<version> (gnu) from the config and asserts it
# still equals this; if derecho bumps cray-mpich, the check fails so the MPICH
# stand-in can be re-evaluated.
cray_mpich = 8.1.27

[pinned_baseline]
# The derecho gnu stack the published image targets, read from
# ccs_config_cesm1.0.48 -- the ccs_config this branch carried before the
# ctsm5.4.054 rebase, and so the one the image was built and validated against.
# Read back with:
#   cd ccs_config && git show ccs_config_cesm1.0.48:machines/derecho/config_machines.xml
#
# Values are derecho's, not the container's. Where the container deliberately
# differs, that is noted; see check-derecho-versions.py for which ARG maps to
# which mode.
ccs_config_tag = ccs_config_cesm1.0.48
gcc = 12.2.0
cray_mpich = 8.1.27
netcdf_c = 4.9.2
parallel_netcdf = 1.12.3
esmf = 8.6.0
parallelio = 2.6.2
# derecho's gnu mpi-serial at the pin. The container deliberately uses 2.5.4,
# CTSM's libraries/mpi-serial pin, so this is a guard value only.
mpi_serial = 2.3.0

# NOTE for whoever revisits the ESMF question: at this pin, derecho's gnu
# mpi-serial builds loaded parallelio/2.6.2 and esmf/8.6.0 -- the SAME modules
# as its full-MPI builds. ccs_config says so itself, in a comment above those
# blocks: the libraries "seem to have been built with a full mpi library".
# So at the pin, derecho's serial ESMF was NOT built against derecho's
# mpi-serial, and matching derecho's ESMF build inputs was not possible.
# After the rebase derecho has a real serial stack -- mpi-serial/2.5.3,
# parallelio-serial/2.6.8, esmf/8.9.1 in one block -- so that argument only
# starts to hold from ccs_config_cesm1.0.88 onward.
