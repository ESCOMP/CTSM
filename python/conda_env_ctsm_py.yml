# This file is used by py_env_create to install the latest version of the ctsm_pylib conda environment.
name: ctsm_pylib
channels:
  - conda-forge
  - defaults
dependencies:
  - python
  - dask
  - xarray
  - tqdm
  - scipy
  - netcdf4
  - requests
  - xesmf
  - numba
  - pylint
  - black
  - cartopy
  - matplotlib
  - compliance-checker
  - pip

  # For VS code
  # fortls used in FORTRAN-IntelliSense extension, add path to fortls below to the VS setting fort-ls.executablePath
  - fortls

  # For building docs
  - pip:
    - -r ../doc/ctsm-docs_container/requirements.txt

  # Used in ctsm_postprocessing repo
  - pytest
  - coverage
