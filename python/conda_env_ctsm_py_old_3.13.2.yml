# This file is used by py_env_create to install a previous version of the ctsm_pylib environment,
# which used Python 3.13.2. Doing so is only useful for running CTSM python tools in repos from
# before the subsequent ctsm_pylib version (with Python 3.13.13) was introduced.
#
name: ctsm_pylib
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13.2
  - dask=2025.7.0
  - xarray=2025.1.2
  - tqdm=4.67.1
  - scipy=1.15.2
  - netcdf4=1.7.2
  - requests=2.32.3
  - xesmf=0.8.8
  - numba=0.61.0
  - pylint=3.3.4
  - black=25.1.0
  - cartopy=0.24.0
  - matplotlib=3.10.1
  - compliance-checker=6.1.0
  - pip=25.0.1

  # For VS code
  # fortls used in FORTRAN-IntelliSense extension, add path to fortls below to the VS setting fort-ls.executablePath
  - fortls=3.2.2

  # For building docs
  - pip:
    - -r ../doc/ctsm-docs_container/requirements.txt

  # Used in ctsm_postprocessing repo
  - pytest=8.3.5
  - coverage=7.8.0
